<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#08011A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ELOI">
  <meta name="robots" content="noindex, nofollow">
  <title>Orçamento — ELOI Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Manrope:wght@300..800&display=swap">
  <link rel="stylesheet" href="/assets/eloi-admin/admin.css">
  <style>
    /* .aurora/.blob (fundo) e tokens vêm do admin.css — só o que é específico
       deste documento de orçamento fica aqui. */
    .doc{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 22px 70px}
    .topbar{position:static;border-bottom:none;background:none;padding:48px 0 8px;justify-content:flex-start}
    .topbar .logo{height:56px;width:auto;display:block}
    .eyebrow{font-size:.74rem;letter-spacing:.20em;text-transform:uppercase;color:var(--texto-3);font-family:var(--fonte-corpo);font-variation-settings:'wght' 600;margin:26px 0 10px}

    .card{background:var(--chao);border:1px solid var(--linha);border-radius:var(--raio-painel);padding:32px 34px}
    .cli{font-size:.85rem;color:var(--texto-3);margin-bottom:4px}
    .card h1{font-family:var(--fonte-titulo);font-size:clamp(1.4rem,4vw,2rem);font-variation-settings:'wght' 700;letter-spacing:-.02em;line-height:1.15;margin-bottom:22px;color:var(--texto)}

    .itens{border-top:1px solid var(--linha)}
    .item{display:flex;justify-content:space-between;gap:16px;padding:15px 2px;border-bottom:1px solid var(--linha);font-size:.96rem;font-family:var(--fonte-corpo)}
    .item .nm{color:var(--texto)}
    .item .vl{color:var(--texto);font-family:var(--fonte-titulo);font-variant-numeric:tabular-nums;font-variation-settings:'wght' 600;white-space:nowrap}
    .item.neg .vl{color:var(--lima)}
    .empty{padding:18px 2px;color:var(--texto-3)}

    .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;padding-top:18px;border-top:2px solid var(--roxo)}
    .total span{font-size:.95rem;color:var(--texto-3)}
    .total strong{font-family:var(--fonte-titulo);font-size:1.7rem;color:var(--texto);font-variant-numeric:tabular-nums;font-variation-settings:'wght' 700}

    .meta{font-size:.78rem;color:var(--texto-3);margin-top:18px}
    .note{background:var(--brand-soft);border:1px solid rgba(125,42,232,.32);border-radius:var(--raio-card);padding:14px 18px;font-size:.86rem;color:var(--texto-2);margin-top:22px}
    .note.ok{background:var(--good-soft);border-color:rgba(223,248,6,.35);color:var(--texto)}

    .foot{text-align:left;color:var(--texto-3);font-size:.82rem;padding-top:30px;line-height:1.8}
    .foot a{color:var(--texto-2);text-decoration:none}

    .acoes{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
    .acoes button{flex:1;min-width:160px;min-height:44px;border:none;border-radius:var(--raio-controle);font-family:var(--fonte-corpo);font-size:.92rem;font-variation-settings:'wght' 600;padding:14px 20px;cursor:pointer;transition:background .18s,transform .14s}
    .acoes button:disabled{opacity:.5;cursor:default}
    .acoes button.btn-ok{background:var(--roxo);color:var(--white)}
    .acoes button.btn-ok:hover:not(:disabled){background:var(--roxo-hover);transform:translateY(-1px)}
    .acoes button.btn-no{background:transparent;border:1px solid rgba(253,68,0,.4);color:var(--coral)}
    .acoes button.btn-no:hover:not(:disabled){background:var(--bad-soft)}

    .state{text-align:center;padding:90px 20px;color:var(--texto-3);position:relative;z-index:1}
    .state .ic{font-size:2.6rem;opacity:.5;margin-bottom:14px}
    @media(max-width:560px){.card{padding:26px 22px}}
  </style>
</head>
<body>
<div class="aurora"><span class="blob b1"></span><span class="blob b2"></span></div>

<div id="root">
  <div class="state" id="loading">Carregando orçamento…</div>
</div>

<script src="/assets/eloi-admin/orcamento.js"></script>
<script>
const FN = 'https://nlamznxoocmygfvnqcns.supabase.co/functions/v1/orcamentos';
const LOGO = `<img class="logo" src="/assets/eloi-admin/wordmark.svg" alt="ELOI Studio">`;

function brl(n){ return 'R$ ' + (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function showState(ic, msg){
  document.getElementById('root').innerHTML = `<div class="state"><div class="ic">${ic}</div>${esc(msg)}</div>`;
}

let CUR_TOKEN = null;

function render(o){
  const itens = Array.isArray(o.itens) ? o.itens : [];
  const linhas = itens.length
    ? itens.map(it=>{
        const v = Number(it.valor)||0;
        return `<div class="item ${v<0?'neg':''}"><span class="nm">${esc(it.nome||'—')}</span><span class="vl">${v<0?'− ':''}${brl(Math.abs(v))}</span></div>`;
      }).join('')
    : '<div class="empty">Sem itens.</div>';
  const _r = window.EloiOrcamento.calcular({itens, complexidade:o.complexidade, urgencia:o.urgencia, desconto_pct:o.desconto_pct});
  const ajustesHtml = _r.ajustes.length
    ? `<div class="item"><span class="nm">Subtotal</span><span class="vl">${brl(_r.base)}</span></div>` +
      _r.ajustes.map(a=>`<div class="item ${a.valor<0?'neg':''}"><span class="nm">${esc(a.nome)}</span><span class="vl">${a.valor<0?'− ':'+ '}${brl(Math.abs(a.valor))}</span></div>`).join('')
    : '';
  const dt =o.created_at ? new Date(o.created_at).toLocaleDateString('pt-BR') : '';
  const status = o.status || 'rascunho';
  const rodape = status === 'enviado'
    ? `<div class="acoes"><button class="btn-ok" onclick="decidir('aprovado')">Aprovar orçamento</button><button class="btn-no" onclick="decidir('recusado')">Recusar</button></div>`
    : status === 'aprovado' ? `<div class="note ok">✓ Orçamento aprovado. Em breve entramos em contato pra dar início.</div>`
    : status === 'recusado' ? `<div class="note">Orçamento marcado como recusado. Qualquer dúvida, é só responder por aqui.</div>`
    : `<div class="note">Proposta válida por 15 dias. Para aprovar ou tirar dúvidas, é só responder por aqui.</div>`;
  document.getElementById('root').innerHTML = `
    <div class="doc">
      <div class="topbar">${LOGO}</div>
      <div class="eyebrow">Proposta de Orçamento</div>
      <div class="card">
        ${o.cliente?`<div class="cli">${esc(o.cliente)}</div>`:''}
        <h1>${esc(o.titulo||'Orçamento')}</h1>
        <div class="itens">${linhas}${ajustesHtml}</div>
        <div class="total"><span>Total</span><strong>${brl(o.valor_total)}</strong></div>
        ${dt?`<div class="meta">Emitido em ${dt}</div>`:''}
        ${rodape}
      </div>
      <div class="foot">ELOI Studio<br><a href="mailto:contato@eloidesign.com.br">contato@eloidesign.com.br</a> · eloidesign.com.br</div>
    </div>`;
}

async function decidir(decisao){
  const btns = document.querySelectorAll('.acoes button');
  btns.forEach(b=>b.disabled=true);
  try{
    const r = await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'client_decide',token:CUR_TOKEN,decisao})});
    const d = await r.json();
    if(!r.ok || d.error) throw new Error(d.error||'erro');
    carregar();
  }catch(e){
    btns.forEach(b=>b.disabled=false);
    alert('Não deu pra registrar sua resposta agora. Tenta de novo em instantes.');
  }
}

function carregar(){
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  CUR_TOKEN = token;
  if(!token){ showState('🔗','Link inválido.'); return; }
  fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'public_get',token})})
    .then(r=> r.ok ? r.json() : Promise.reject(r.status))
    .then(d=>{ if(d&&d.orcamento) render(d.orcamento); else showState('🔍','Orçamento não encontrado.'); })
    .catch(s=>{ showState(s===404?'🔍':'⚠️', s===404?'Orçamento não encontrado ou link expirado.':'Não foi possível carregar o orçamento.'); });
}
carregar();
</script>
<script src="/assets/eloi-admin/pagenav.js"></script>
</body>
</html>
